# redis.conf —— 生产最佳实践基线
# 说明：本文件纳入版本控制，不含真实密钥；requirepass 由 compose 通过 --requirepass 注入，不在此硬编码。
# 上线前请按主机规格调整 maxmemory、save 策略等。

# ── 网络 ──
# 容器内监听全部接口，由 docker 网络做隔离
bind 0.0.0.0
# 设置密码后 protected-mode 自动失效，显式关闭以便跨容器访问
protected-mode no
port 6379
tcp-backlog 511
tcp-keepalive 300
timeout 0

# ── 持久化 ──
# AOF：更高 durability，appendfsync everysec 为官方推荐平衡档
appendonly yes
appendfsync everysec
# RDB 快照与 AOF 并存，兼顾快速重启与灾难恢复
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
# 持久化文件落盘到挂载卷
dir /data

# ── 内存管理 ──
# 上限应按宿主机内存调整；此处为基线默认值
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ── 日志 ──
loglevel notice

# ── 安全 ──
# 密码由 compose 通过 --requirepass 注入，此处不写明文

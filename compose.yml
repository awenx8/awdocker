networks:
  net:

volumes:
  mysql-data:
  redis-data:
  postgres-data:

services:
  mysql:
    image: mysql:8.4
    container_name: awdocker-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-awdocker_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-awdocker}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower_case_table_names=1
    networks:
      - net

  redis:
    image: redis:7.4
    container_name: awdocker-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:-awdocker_dev}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - /etc/redis/redis.conf
      - --requirepass
      - "${REDIS_PASSWORD:-awdocker_dev}"
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - redis-data:/data
    networks:
      - net

  postgres:
    image: postgres:17
    container_name: awdocker-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${POSTGRES_USER:-awdocker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-awdocker_dev}
      POSTGRES_DB: ${POSTGRES_DATABASE:-awdocker}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - net

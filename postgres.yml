# PostgreSQL 基础设施片段（单一真相源，供各应用仓 include）
# 所有参数仅通过 env 注入，禁止任何硬编码；取值由各应用仓的 .env 提供。
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT}:5432"
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - awinfra

volumes:
  postgres-data:

networks:
  awinfra:
    name: ${INFRA_NETWORK}
